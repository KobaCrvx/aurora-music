plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aurora.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.aurora.music"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('aurora-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
