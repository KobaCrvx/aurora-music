name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK de Android (ya viene en el servidor)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Aurora-Music.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Aurora-Music.apk --title "Aurora Music (APK para Android)" --notes "APK listo para instalar en Android. Descarga Aurora-Music.apk, abrelo en tu telefono y permite instalar apps de origen desconocido si te lo pide."
